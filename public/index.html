<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevCode - a fast, modern online compiler for Python, Java, C, C++, JavaScript, TypeScript, Go and more."
    />
    <meta name="color-scheme" content="dark light" />
    <title>DevCode · Online Compiler</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M12 10 6.5 16 12 22M20 10l5.5 6L20 22' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="DevCode home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <rect width="32" height="32" rx="8" fill="url(#g)" />
            <path
              d="M12 10 6.5 16 12 22M20 10l5.5 6L20 22"
              stroke="#fff"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
                <stop stop-color="#6366f1" />
                <stop offset="1" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-text">
          <strong>DevCode</strong>
          <span class="brand-sub">Online Compiler</span>
        </span>
      </a>

      <div class="topbar-actions">
        <div class="lang-field">
          <label class="visually-hidden" for="language">Language</label>
          <select id="language" class="lang-select" title="Select language"></select>
        </div>

        <button
          id="theme-toggle"
          class="icon-btn"
          type="button"
          title="Toggle dark / light mode"
          aria-label="Toggle dark light mode"
        >
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <button id="run-btn" class="run-btn" type="button">
          <span class="run-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15">
              <path d="M7 4.5v15l13-7.5-13-7.5Z" fill="currentColor" />
            </svg>
          </span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="run-label">Run</span>
          <kbd class="run-kbd">Ctrl&nbsp;↵</kbd>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="editor-pane" aria-label="Code editor">
        <div class="pane-tabs">
          <span class="file-tab" id="file-tab">
            <span class="file-dot" aria-hidden="true"></span>
            <span id="file-name">main.py</span>
          </span>
          <span class="pane-spacer"></span>
          <button id="reset-btn" class="ghost-btn" type="button" title="Reset to starter code">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Reset
          </button>
        </div>
        <div id="editor" class="editor-host"></div>
      </section>

      <aside class="side-pane">
        <section class="panel input-panel" aria-label="Program input">
          <header class="panel-head">
            <h2>Input <span class="panel-hint">stdin</span></h2>
            <button id="clear-input" class="ghost-btn" type="button">Clear</button>
          </header>
          <textarea
            id="stdin"
            class="stdin-input"
            spellcheck="false"
            placeholder="Type input for your program, then hit Run…"
          ></textarea>
        </section>

        <section class="panel output-panel" aria-label="Program output">
          <header class="panel-head">
            <h2>Output</h2>
            <div class="panel-actions">
              <span id="status-chip" class="status-chip is-idle" role="status" aria-live="polite"
                >Idle</span
              >
              <button id="copy-output" class="ghost-btn" type="button" title="Copy output">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                  <rect
                    x="9"
                    y="9"
                    width="11"
                    height="11"
                    rx="2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <path
                    d="M5 15H4a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h9a1 1 0 0 1 1 1v1"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Copy
              </button>
              <button id="clear-output" class="ghost-btn" type="button" title="Clear output">
                Clear
              </button>
            </div>
          </header>

          <div id="output" class="output" tabindex="0">
            <p class="output-empty" id="output-empty">
              Output will appear here. Press <kbd>Ctrl</kbd>&nbsp;+&nbsp;<kbd>Enter</kbd> or click
              <strong>Run</strong>.
            </p>
          </div>

          <footer class="run-meta" id="run-meta" aria-live="polite"></footer>
        </section>
      </aside>
    </main>

    <footer class="statusbar">
      <span class="status-item" id="engine-badge" title="Code execution engine">
        <span class="badge-dot" aria-hidden="true"></span>
        <span id="engine-text">connecting…</span>
      </span>
      <span class="status-item status-branch" title="Repository">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
          <circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7" />
          <circle cx="6" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7" />
          <circle cx="18" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path
            d="M6 8.5v7M8.4 6.6c4 .6 7.4 1.2 7.4 5.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
        main
      </span>
      <span class="status-spacer"></span>
      <span class="status-item" id="cursor-pos">Ln 1, Col 1</span>
      <span class="status-item" id="indent-info">Spaces: 4</span>
      <span class="status-item" id="encoding-info">UTF-8</span>
      <span class="status-item" id="lang-info">Python</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/monaco/vs/loader.js"></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
